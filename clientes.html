<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaeta Prime — Clientes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --grafite: #1A1A18;
    --grafite2: #242422;
    --grafite3: #2e2e2b;
    --grafite4: #383835;
    --cobre: #B8955A;
    --cobre-light: #d4ae7a;
    --off: #F5F4F0;
    --off2: #e8e7e3;
    --muted: #888884;
    --success: #4caf7d;
    --warning: #e6a817;
    --danger: #e05555;
    --sidebar-w: 220px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { background: var(--grafite); color: var(--off); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; }

  .sidebar { width: var(--sidebar-w); background: var(--grafite2); border-right: 1px solid rgba(184,149,90,0.1); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
  .sidebar-logo { padding: 28px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .sidebar-logo-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; }
  .sidebar-logo-sub { font-size: 10px; color: var(--cobre); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2px; }
  .sidebar-nav { padding: 16px 0; flex: 1; }
  .nav-section { font-size: 9px; font-weight: 500; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; padding: 12px 24px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 24px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.15s; text-decoration: none; border-left: 2px solid transparent; }
  .nav-item:hover { color: var(--off); background: rgba(255,255,255,0.03); }
  .nav-item.active { color: var(--cobre); border-left-color: var(--cobre); background: rgba(184,149,90,0.05); }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; }
  .sidebar-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.05); }
  .logout-btn { font-size: 12px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: color 0.15s; background: none; border: none; font-family: 'DM Sans', sans-serif; }
  .logout-btn:hover { color: var(--danger); }

  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }

  .topbar { padding: 20px 32px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; }
  .topbar-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; }

  .btn-primary { background: var(--cobre); color: var(--grafite); border: none; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 20px; cursor: pointer; transition: background 0.15s; }
  .btn-primary:hover { background: var(--cobre-light); }

  .content { padding: 28px 32px; flex: 1; }

  .top-bar { display: flex; gap: 10px; margin-bottom: 18px; align-items: center; }

  .search-input { background: var(--grafite2); border: 1px solid rgba(255,255,255,0.07); border-radius: 2px; color: var(--off); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 9px 14px; outline: none; width: 280px; transition: border-color 0.2s; }
  .search-input:focus { border-color: rgba(184,149,90,0.3); }
  .search-input::placeholder { color: var(--muted); opacity: 0.5; }

  .count-label { margin-left: auto; font-size: 12px; color: var(--muted); }

  .table-wrap { background: var(--grafite2); border: 1px solid rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
  tbody td { padding: 13px 16px; font-size: 13px; color: var(--off2); border-bottom: 1px solid rgba(255,255,255,0.03); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255,255,255,0.02); }

  .badge { display: inline-block; font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 2px; letter-spacing: 0.05em; }
  .badge-cobre { background: rgba(184,149,90,0.15); color: var(--cobre); }
  .badge-green { background: rgba(76,175,125,0.15); color: var(--success); }

  .action-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 2px; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .action-btn:hover { color: var(--off); background: rgba(255,255,255,0.05); }
  .action-btn.danger:hover { color: var(--danger); }
  .action-btn.whatsapp:hover { color: var(--success); }

  .empty-state { text-align: center; padding: 48px; color: var(--muted); font-size: 13px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--grafite2); border: 1px solid rgba(184,149,90,0.2); border-radius: 2px; width: 100%; max-width: 480px; padding: 32px; }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; margin-bottom: 24px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 14px; }
  .form-group.full { grid-column: 1 / -1; }

  label { display: block; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }

  input { width: 100%; background: var(--grafite3); border: 1px solid rgba(255,255,255,0.07); border-radius: 2px; color: var(--off); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 10px 12px; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: rgba(184,149,90,0.4); }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel { background: none; border: 1px solid rgba(255,255,255,0.1); border-radius: 2px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 20px; cursor: pointer; transition: all 0.15s; }
  .btn-cancel:hover { color: var(--off); }

  /* DRAWER — histórico do cliente */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; }
  .drawer-overlay.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; background: var(--grafite2); border-left: 1px solid rgba(184,149,90,0.15); z-index: 201; padding: 32px; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s; }
  .drawer.open { transform: translateX(0); }
  .drawer-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; margin-bottom: 4px; }
  .drawer-sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
  .drawer-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .drawer-close:hover { color: var(--off); }
  .drawer-section { font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px; margin-top: 24px; }
  .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--muted); }
  .stat-val { color: var(--off); font-weight: 500; }
  .stat-val.cobre { color: var(--cobre); }
  .stat-val.success { color: var(--success); }
  .venda-item { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .venda-item:last-child { border-bottom: none; }
  .venda-produto { font-size: 13px; color: var(--off); }
  .venda-detalhe { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--grafite4); border: 1px solid rgba(184,149,90,0.3); border-radius: 2px; padding: 12px 20px; font-size: 13px; color: var(--off); z-index: 300; transform: translateY(80px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(76,175,125,0.4); color: var(--success); }
  .toast.error { border-color: rgba(224,85,85,0.4); color: var(--danger); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-name">Gaeta Prime</div>
    <div class="sidebar-logo-sub">Admin</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Principal</div>
    <a class="nav-item" href="dashboard.html"><span class="nav-icon">◈</span> Dashboard</a>
    <a class="nav-item" href="vendas.html"><span class="nav-icon">◎</span> Vendas</a>
    <a class="nav-item" href="estoque.html"><span class="nav-icon">◰</span> Estoque</a>
    <a class="nav-item active" href="clientes.html"><span class="nav-icon">◑</span> Clientes</a>
    <div class="nav-section">Gestão</div>
    <a class="nav-item" href="produtos.html"><span class="nav-icon">◇</span> Produtos</a>
    <a class="nav-item" href="parceiros.html"><span class="nav-icon">◈</span> Parceiros</a>
    <a class="nav-item" href="comissoes.html"><span class="nav-icon">◎</span> Comissões</a>
  </nav>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="handleLogout()"><span>⊗</span> Sair</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-title">Clientes</div>
    <button class="btn-primary" onclick="openModal()">+ Novo Cliente</button>
  </div>

  <div class="content">
    <div class="top-bar">
      <input class="search-input" type="text" placeholder="Buscar por nome, telefone ou e-mail..." oninput="buscar(this.value)">
      <span class="count-label" id="countLabel"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>CPF</th>
            <th>Compras</th>
            <th>Total gasto</th>
            <th>Cadastrado em</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="clientesBody">
          <tr><td colspan="8" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- MODAL CADASTRO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Novo Cliente</div>
    <input type="hidden" id="editId">

    <div class="form-group full">
      <label>Nome completo</label>
      <input type="text" id="nome" placeholder="Nome do cliente">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Telefone / WhatsApp</label>
        <input type="text" id="telefone" placeholder="(11) 99999-9999">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="email@exemplo.com">
      </div>
    </div>

    <div class="form-group">
      <label>CPF (opcional)</label>
      <input type="text" id="cpf" placeholder="000.000.000-00">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="salvar()">Salvar Cliente</button>
    </div>
  </div>
</div>

<!-- DRAWER HISTÓRICO -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="drawer-close" onclick="closeDrawer()">✕</button>
  <div class="drawer-title" id="drawerNome">—</div>
  <div class="drawer-sub" id="drawerSub">—</div>

  <div class="drawer-section">Resumo</div>
  <div id="drawerResumo"></div>

  <div class="drawer-section">Histórico de compras</div>
  <div id="drawerVendas"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://zdnnbxkewbmedtidoxyd.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpkbm5ieGtld2JtZWR0aWRveHlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDU1NTIsImV4cCI6MjA5NjE4MTU1Mn0.npq4b4do5qJvhHWlO0v3-eKWC-PxdGikMYpGYKkWmTA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  sb.auth.getSession().then(({ data }) => {
    if (!data.session) window.location.href = 'login.html';
  });

  let todosClientes = [];
  let buscaAtiva = '';

  function formatBRL(v) {
    return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  }

  function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('pt-BR');
  }

  async function loadClientes() {
    const { data, error } = await sb.from('customers')
      .select('*, sales(sale_price, net_profit, product_name, status, sold_at, payment_method)')
      .order('created_at', { ascending: false });

    if (error) { showToast('Erro ao carregar', 'error'); return; }
    todosClientes = data || [];
    document.getElementById('countLabel').textContent = `${todosClientes.length} cliente${todosClientes.length !== 1 ? 's' : ''}`;
    renderClientes();
  }

  function buscar(q) {
    buscaAtiva = q.toLowerCase();
    renderClientes();
  }

  function renderClientes() {
    let lista = todosClientes;
    if (buscaAtiva) lista = lista.filter(c =>
      (c.name || '').toLowerCase().includes(buscaAtiva) ||
      (c.phone || '').includes(buscaAtiva) ||
      (c.email || '').toLowerCase().includes(buscaAtiva)
    );

    document.getElementById('countLabel').textContent = `${lista.length} cliente${lista.length !== 1 ? 's' : ''}`;

    const tbody = document.getElementById('clientesBody');
    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Nenhum cliente encontrado</td></tr>';
      return;
    }

    tbody.innerHTML = lista.map(c => {
      const vendas = c.sales || [];
      const total = vendas.reduce((a, v) => a + Number(v.sale_price || 0), 0);
      return `<tr>
        <td><strong>${c.name}</strong></td>
        <td>${c.phone || '—'}</td>
        <td style="font-size:12px">${c.email || '—'}</td>
        <td style="font-size:12px;color:var(--muted)">${c.cpf || '—'}</td>
        <td><span class="badge badge-cobre">${vendas.length}</span></td>
        <td style="color:var(--cobre)">${total > 0 ? formatBRL(total) : '—'}</td>
        <td style="font-size:12px;color:var(--muted)">${formatDate(c.created_at)}</td>
        <td style="white-space:nowrap">
          ${c.phone ? `<button class="action-btn whatsapp" onclick="abrirWhatsApp('${c.phone}', '${c.name}')">WhatsApp</button>` : ''}
          <button class="action-btn" onclick="verHistorico('${c.id}')">Histórico</button>
          <button class="action-btn" onclick='editarCliente(${JSON.stringify(c)})'>Editar</button>
          <button class="action-btn danger" onclick="deletar('${c.id}')">Excluir</button>
        </td>
      </tr>`;
    }).join('');
  }

  function abrirWhatsApp(phone, nome) {
    const num = phone.replace(/\D/g, '');
    const full = num.startsWith('55') ? num : '55' + num;
    window.open(`https://wa.me/${full}?text=Olá ${nome}! Tudo bem?`, '_blank');
  }

  async function verHistorico(clienteId) {
    const cliente = todosClientes.find(c => c.id === clienteId);
    if (!cliente) return;

    document.getElementById('drawerNome').textContent = cliente.name;
    document.getElementById('drawerSub').textContent = [cliente.phone, cliente.email].filter(Boolean).join(' · ') || '—';

    const vendas = cliente.sales || [];
    const totalGasto = vendas.reduce((a, v) => a + Number(v.sale_price || 0), 0);
    const totalLucro = vendas.reduce((a, v) => a + Number(v.net_profit || 0), 0);

    document.getElementById('drawerResumo').innerHTML = `
      <div class="stat-row"><span class="stat-label">Total de compras</span><span class="stat-val">${vendas.length}</span></div>
      <div class="stat-row"><span class="stat-label">Total gasto</span><span class="stat-val cobre">${formatBRL(totalGasto)}</span></div>
      <div class="stat-row"><span class="stat-label">Lucro gerado</span><span class="stat-val success">${formatBRL(totalLucro)}</span></div>
    `;

    if (!vendas.length) {
      document.getElementById('drawerVendas').innerHTML = '<p style="color:var(--muted);font-size:13px">Nenhuma compra registrada</p>';
    } else {
      document.getElementById('drawerVendas').innerHTML = vendas
        .sort((a, b) => new Date(b.sold_at) - new Date(a.sold_at))
        .map(v => `
          <div class="venda-item">
            <div class="venda-produto">${v.product_name}</div>
            <div class="venda-detalhe">${formatBRL(v.sale_price)} · ${v.payment_method || '—'} · ${formatDate(v.sold_at)}</div>
          </div>
        `).join('');
    }

    document.getElementById('drawerOverlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');
  }

  function closeDrawer() {
    document.getElementById('drawerOverlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
  }

  function openModal() {
    document.getElementById('editId').value = '';
    document.getElementById('modalTitle').textContent = 'Novo Cliente';
    document.getElementById('nome').value = '';
    document.getElementById('telefone').value = '';
    document.getElementById('email').value = '';
    document.getElementById('cpf').value = '';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function editarCliente(c) {
    document.getElementById('editId').value = c.id;
    document.getElementById('modalTitle').textContent = 'Editar Cliente';
    document.getElementById('nome').value = c.name || '';
    document.getElementById('telefone').value = c.phone || '';
    document.getElementById('email').value = c.email || '';
    document.getElementById('cpf').value = c.cpf || '';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  async function salvar() {
    const id = document.getElementById('editId').value;
    const nome = document.getElementById('nome').value.trim();
    if (!nome) { showToast('Informe o nome do cliente', 'error'); return; }

    const dados = {
      name:  nome,
      phone: document.getElementById('telefone').value.trim() || null,
      email: document.getElementById('email').value.trim() || null,
      cpf:   document.getElementById('cpf').value.trim() || null,
    };

    let error;
    if (id) {
      ({ error } = await sb.from('customers').update(dados).eq('id', id));
    } else {
      ({ error } = await sb.from('customers').insert(dados));
    }

    if (error) { showToast('Erro: ' + error.message, 'error'); return; }
    showToast(id ? 'Cliente atualizado' : 'Cliente cadastrado', 'success');
    closeModal();
    loadClientes();
  }

  async function deletar(id) {
    if (!confirm('Excluir este cliente?')) return;
    const { error } = await sb.from('customers').delete().eq('id', id);
    if (error) { showToast('Erro ao excluir', 'error'); return; }
    showToast('Cliente excluído', 'success');
    loadClientes();
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast', 3000);
  }

  async function handleLogout() {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  loadClientes();
</script>
</body>
</html>
